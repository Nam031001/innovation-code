<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../supplies/style/style.css" />
    <title>시위 준비물 · 다시쓰는 빛의 연대</title>
  </head>
  <body>
    <header class="topbar">
      <nav class="topbar-menu">
        <button
          class="topbar-menu-toggle"
          type="button"
          aria-label="메뉴 열기"
          aria-expanded="false">
          <img src="../../asset/Jhamburger.png" alt="" />
        </button>
        <ul class="topbar-menu-list" role="menu">
          <li role="none" style="--i: 0">
            <a role="menuitem" href="../history/index.html">
              호외요 호외(민주시위 모음)
            </a>
          </li>
          <li role="none" style="--i: 1">
            <a role="menuitem" href="../object/index.html">도구 아카이브</a>
          </li>
          <li role="none" style="--i: 2">
            <a role="menuitem" href="../library/index.html">라이브러리</a>
          </li>
          <li role="none" style="--i: 3">
            <a role="menuitem" href="../mine/index.html">나만의 깃발 만들기</a>
          </li>
          <li role="none" style="--i: 4">
            <a role="menuitem" href="index.html">시위 준비물</a>
          </li>
          <li role="none" style="--i: 5">
            <a role="menuitem" href="../future/index.html">미래의 시위</a>
          </li>
        </ul>
      </nav>
      <div class="topbar-logo">
        <a href="../../index.html">
          <img src="../../asset/logo.png" alt="logo" />
        </a>
      </div>
    </header>

    <main class="supplies">
      <div class="supplies-scene" id="scene"></div>

      <div class="supplies-overlay">
        <h1 class="supplies-title">시위 준비물</h1>
        <p class="supplies-count" id="count">제대로 담은 준비물&nbsp;&nbsp;0 / 9</p>

        <div class="bin bin--left" id="binLeft">
          <p class="bin-label">필수준비물<br />은 이곳에!</p>
          <ul class="bin-tags">
            <img src="../../asset/supplies/supplies-1.png" alt="">
          </ul>
        </div>

        <div class="bin bin--right" id="binRight">
          <p class="bin-label">선택준비물<br />은 이곳에!</p>
          <ul class="bin-tags">
            <img src="../../asset/supplies/supplies-2.png" alt="">
          </ul>
        </div>
      </div>
    </main>

    <!--
      Shown once every supply is in its correct bin: a confetti burst
      plus this modal. The two buttons are drawn into popup.png, so the
      real <button>s are transparent hotspots laid over them —
      left = "한 번 더 하기" (reload), right = "다른 이야기 둘러보기" (main page).
    -->
    <div class="supplies-done" id="doneModal" hidden>
      <div class="supplies-done-card">
        <img
          class="supplies-done-img"
          src="../../asset/supplies/popup.png"
          alt="축하합니다! 준비완료!" />
        <button
          class="supplies-done-btn supplies-done-btn--again"
          type="button"
          id="doneAgain"
          aria-label="한 번 더 하기"></button>
        <button
          class="supplies-done-btn supplies-done-btn--home"
          type="button"
          id="doneHome"
          aria-label="다른 이야기 둘러보기"></button>
      </div>
    </div>

    <script src="./script/matter.min.js"></script>
    <script src="./script/confetti.min.js"></script>
    <script src="./script/script.js"></script>
  </body>
</html>
