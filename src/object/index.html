    <main class="object" id="objectScene">
      <!--
        3D coordinate map. #objectWorld holds the fixed-aspect plane;
        every tool sits at a percentage --x / --y and a depth --d, so
        they scatter through the #objectScene perspective. script.js
        drags-to-pan, shift/right-drag-to-orbit, wheel-to-zoom the whole
        volume. The dotted axis cross is one image (asset/object/Union.png):
        저항성 ↔ 위협성 horizontal, 도구적 ↕ 상징성 vertical. The title
        is pinned to the top of .object, outside the moving volume.
      -->
      
      <div class="title">
        <p class="object-title">도구 아카이브</p>
        <p class="sub">
          스크롤: 확대
          <br />
          우클릭드래그: 시점변환
        </p>
        </div>
