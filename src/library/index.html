<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>라이브러리 · 다시쓰는 빛의 연대</title>
  </head>
  <body>
    <header class="topbar">
      <nav class="topbar-menu">
        <button
          class="topbar-menu-toggle"
          type="button"
          aria-label="메뉴 열기"
          aria-expanded="false">
          <img src="../../asset/Jhamburger.png" alt="" />
        </button>
        <ul class="topbar-menu-list" role="menu">
          <li role="none" style="--i: 0">
            <a role="menuitem" href="index.html">라이브러리</a>
          </li>
          <li role="none" style="--i: 1">
            <a role="menuitem" href="../history/index.html">
              호외요 호외(민주시위 모음)
            </a>
          </li>
          <li role="none" style="--i: 2">
            <a role="menuitem" href="../object/index.html">도구 아카이브</a>
          </li>
          <li role="none" style="--i: 3">
            <a role="menuitem" href="../future/index.html">미래의 시위</a>
          </li>
          <li role="none" style="--i: 4">
            <a role="menuitem" href="../mine/index.html">나만의 깃발 만들기</a>
          </li>
          <li role="none" style="--i: 5">
            <a role="menuitem" href="../supplies/index.html">시위 준비물</a>
          </li>
        </ul>
      </nav>
      <div class="topbar-logo">
        <a href="../../index.html">
          <img src="../../asset/logo.png" alt="logo" />
        </a>
      </div>
    </header>
    <main class="library">
      <div class="library-title-box">
        <p class="freedom">사진을 클릭해보세요</p>
        <span class="library-title-text">1960-2025</span>
      </div>

      <div class="gallery" id="gallery">
        <div class="sphere-viewport" id="sphereViewport">
          <div class="sphere-scene" id="sphereScene"></div>
        </div>

        <div class="detail" id="detail" hidden>
          <div class="detail-backdrop"></div>

          <figure class="detail-figure">
            <button
              type="button"
              class="detail-close"
              id="detailClose"
              aria-label="닫기">
              <span aria-hidden="true">&times;</span>
            </button>
            <img class="detail-photo" id="detailPhoto" src="" alt="" />
            <figcaption>
              <span class="detail-caption" id="detailCaption"></span>
              <a
                class="detail-link"
                id="detailLink"
                href="#"
                target="_blank"
                rel="noopener"></a>
            </figcaption>
          </figure>

          <button
            type="button"
            class="detail-nav detail-nav-prev"
            id="detailPrev">
            <span aria-hidden="true">‹</span>
            PREVIOUS
          </button>
          <button
            type="button"
            class="detail-nav detail-nav-next"
            id="detailNext">
            NEXT
            <span aria-hidden="true">›</span>
          </button>
        </div>
      </div>
    </main>

    <script src="./script/script.js"></script>
  </body>
</html>
