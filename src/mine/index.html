    <main class="mine">
      <h1 class="mine-title">나만의 이미지로 깃발을 제작해보세요</h1>

      <div class="mine-flags" aria-hidden="true">
        <!--
          Stop-motion flag: the hand-drawn frames (flagGraphic2-4) are
          stacked and hard-cut between with steps() timing, ping-ponging
          2 - 3 - 4 - 3 so the cloth flutters instead of snapping back.
          Each of the three flags runs at its own speed/offset so they
          don't wave in lockstep.
        -->
        <div class="mine-flag">
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic2.png"
            alt="" />
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic3.png"
            alt="" />
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic4.png"
            alt="" />
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic3.png"
            alt="" />
        </div>
        <div class="mine-flag">
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic2.png"
            alt="" />
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic3.png"
            alt="" />
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic4.png"
            alt="" />
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic3.png"
            alt="" />
        </div>
        <div class="mine-flag">
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic2.png"

          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic3.png"
            alt="" />
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic4.png"
            alt="" />
          <img
            class="mine-flag__frame"
            src="../../asset/flag/flagGraphic3.png"
            alt="" />
        </div>

        <div class="mine-steps">
        
          <p>
            <strong>STEP1.</strong> <br>
            화면에 있는 사이트 QR에 접속한다.
          </p>
          <p style="text-align: center; margin: 0;"><img src="../../asset/flag_upload_qr.png" alt=""></p>
          <p>
            <strong>STEP2.</strong>
            <br>
            시위에 들고갈 깃발로써 제작할 이미지를 송신한다.
          </p>
          <p>
            <strong>STEP3.</strong>
            <br>
            핸드폰 화면에 목업된 깃발을 확인하고, 출력하기 버튼을 눌러 출력한다.
          </p>
