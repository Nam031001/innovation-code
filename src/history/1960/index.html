<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>1960 · 호외요 호외 · 다시쓰는 빛의 연대</title>
  </head>
  <body>
    <header class="topbar">
      <button class="topbar__back" type="button" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <div class="topbar__logo">
        <a href="../../../index.html">
          <img src="../../../asset/logoDark.png" alt="logo" />
        </a>
      </div>
    </header>

    <main class="year">
      <audio id="audio" preload="metadata"></audio>

      <aside class="player">
        <div class="playerTop">
          <p class="player__date">1960년 4월 19일</p>
          <h1 class="player__title">Played list</h1>
        </div>

        <ul class="player__list">
          <li
            class="player__track is-active"
            data-index="0"
            tabindex="0"
            role="button">
            1. 사월의 노래
          </li>
        </ul>

        <div class="player__controls">
          <div class="player__buttons">
            <button
              class="player__btn player__prev"
              type="button"
              aria-label="이전 곡">
              <svg viewBox="0 0 24 24">
                <path d="M6 6h2v12H6zM20 6 10 12l10 6z" />
              </svg>
            </button>
            <button
              class="player__btn player__toggle"
              type="button"
              aria-label="재생">
              <svg class="icon-play" viewBox="0 0 24 24">
                <path d="M7 5v14l12-7z" />
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24">
                <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
              </svg>
            </button>
            <button
              class="player__btn player__next"
              type="button"
              aria-label="다음 곡">
              <svg viewBox="0 0 24 24">
                <path d="M16 6h2v12h-2zM4 6l10 6-10 6z" />
              </svg>
            </button>
          </div>

          <input
            class="player__seek"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="재생 구간" />
        </div>
      </aside>

      <div class="newspaper">
        <article class="newspaper__page">
          <div class="newspaper__scroll">
            <img
              class="newspaper__scan"
              src="../../../asset/history/newspaper/1960.png"
              alt="1960년 4월 19일 호외 신문 지면" />
          </div>
        </article>
      </div>
    </main>

    <script src="./script/script.js"></script>
  </body>
</html>
