<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>1960 · 호외요 호외 · 다시쓰는 빛의 연대</title>
  </head>
  <body>
    <header class="topbar">
      <button class="topbar-back" type="button" aria-label="뒤로가기">
        <img
          src="../../../asset/leftArrow.png"
          alt="arrow"
          style="filter: brightness(0) invert(1)" />
      </button>
      <div class="topbar-logo">
        <a href="../../../index.html">
          <img src="../../../asset/logoDark.png" alt="logo" />
        </a>
      </div>
    </header>

    <main class="year">
      <audio
        id="audio"
        preload="metadata"
        loop
        src="../../../music/national-anthem.mp3"></audio>

      <aside class="speaker">
        <p class="speaker-bubble">클릭하면 음악이 재생됩니다</p>
        <button
          class="speaker-btn"
          type="button"
          aria-label="애국가 재생 / 정지"
          aria-pressed="false">
          <img
            src="../../../asset/history/playlist/혼스피커.png"
            alt=""
            class="speaker-img" />
          <span class="speaker-song">애국가</span>
        </button>
      </aside>

      <div class="newspaper">
        <article class="newspaper-page">
          <div class="newspaper-scroll">
            <img
              class="newspaper-scan"
              src="../../../asset/history/newspaper/1960.png"
              alt="1960년 4월 19일 호외 신문 지면" />
          </div>
        </article>
      </div>
    </main>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track">
        <span class="ticker-item">부정선거 다시 하자!</span>
        <span class="ticker-item">학생의 피에 보답하라!</span>
        <span class="ticker-item">폭행 경찰관 물러가라!</span>
        <span class="ticker-item">민주 역적 몰아내자!</span>
        <span class="ticker-item">자유, 정의, 진리 드높이자!</span>
        <span class="ticker-item">마산 학생 사건 규명하라!</span>
        <span class="ticker-item">부정선거 다시 하자!</span>
        <span class="ticker-item">학생의 피에 보답하라!</span>
        <span class="ticker-item">폭행 경찰관 물러가라!</span>
        <span class="ticker-item">민주 역적 몰아내자!</span>
        <span class="ticker-item">자유, 정의, 진리 드높이자!</span>
        <span class="ticker-item">마산 학생 사건 규명하라!</span>
      </div>
    </div>

    <script src="./script/script.js"></script>
  </body>
</html>
