<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>1979 · 호외요 호외 · 다시쓰는 빛의 연대</title>
  </head>
  <body>
    <header class="topbar">
      <button class="topbar-back" type="button" aria-label="뒤로가기">
        <img
          src="../../../asset/leftArrow.png"
          alt="arrow"
          style="filter: brightness(0) invert(1)" />
      </button>
      <div class="topbar-logo">
        <a href="../../../index.html">
          <img src="../../../asset/logoDark.png" alt="logo" />
        </a>
      </div>
    </header>

    <main class="year">
      <audio
        id="audio"
        preload="metadata"
        loop
        src="../../../music/national-anthem.mp3"></audio>

      <aside class="scores">
        <button
          class="scores-btn"
          type="button"
          aria-label="음악 재생 / 정지"
          aria-pressed="false">
          <!-- 곡명은 임시값입니다. .score-name 안의 텍스트를 실제 곡 제목으로 교체하세요. -->
          <span class="score score-1">
            <img
              class="score-img"
              src="../../../asset/history/playlist/악보1.png"
              alt="" />
            <span class="score-name">1. 애국가</span>
          </span>
          <span class="score score-2">
            <img
              class="score-img"
              src="../../../asset/history/playlist/악보2.png"
              alt="" />
            <span class="score-name">2. 정의가</span>
          </span>
          <span class="score score-3">
            <img
              class="score-img"
              src="../../../asset/history/playlist/악보3.png"
              alt="" />
            <span class="score-name">3. 우리 승리하리라</span>
          </span>
          <span class="score score-4">
            <img
              class="score-img"
              src="../../../asset/history/playlist/악보4.png"
              alt="" />
            <span class="score-name">4. 선구자</span>
          </span>
        </button>
        <img
          class="scores-truck"
          src="../../../asset/history/playlist/스피커트럭.png"
          alt="" />
      </aside>

      <div class="newspaper">
        <article class="newspaper-page">
          <div class="newspaper-scroll">
            <img
              class="newspaper-scan"
              src="../../../asset/history/newspaper/1979.png"
              alt="1979년 10월 16일 호외 신문 지면" />
          </div>
        </article>
      </div>
    </main>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track">
        <span class="ticker-item">유신철폐!</span>
        <span class="ticker-item">독재타도!</span>
        <span class="ticker-item">언론자유!</span>
        <span class="ticker-item">학원자유!</span>
        <span class="ticker-item">부가가치세 철폐!</span>
        <span class="ticker-item">유신철폐!</span>
        <span class="ticker-item">독재타도!</span>
        <span class="ticker-item">언론자유!</span>
        <span class="ticker-item">학원자유!</span>
        <span class="ticker-item">부가가치세 철폐!</span>
        <span class="ticker-item">유신철폐!</span>
        <span class="ticker-item">독재타도!</span>
        <span class="ticker-item">언론자유!</span>
        <span class="ticker-item">학원자유!</span>
        <span class="ticker-item">부가가치세 철폐!</span>
      </div>
    </div>

    <script src="./script/script.js"></script>
  </body>
</html>
