<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>1987 · 호외요 호외 · 다시쓰는 빛의 연대</title>
  </head>
  <body>
    <header class="topbar">
      <button class="topbar-back" type="button" aria-label="뒤로가기">
        <img
          src="../../../asset/leftArrow.png"
          alt="arrow"
          style="filter: brightness(0) invert(1)" />
      </button>
      <div class="topbar-logo">
        <a href="../../../index.html">
          <img src="../../../asset/logoDark.png" alt="logo" />
        </a>
      </div>
    </header>

    <main class="year">
      <audio
        id="audio"
        preload="metadata"
        loop
        src="../../../music/national-anthem.mp3"></audio>

      <aside class="tapes">
        <!-- 노래 자리: 각 요소의 data-song에 music 폴더의 곡 파일 경로를 넣으세요. 화면에 보이는 곡 이름은 .tape-song 안의(와 aria-label의) 글자를 바꾸면 됩니다. -->
        <p class="play-hint">카세트테이프를 클릭하면<br />음악이 재생/정지됩니다</p>
        <button
          class="tape tape-1 is-playable"
          data-song="../../../music/임을위한행진곡.mp3"
          type="button"
          aria-label="임을 위한 행진곡 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">임을 위한 행진곡</span>
        </button>
        <button
          class="tape tape-2 is-playable"
          data-song="../../../music/그날이오면.mp3"
          type="button"
          aria-label="그날이오면 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">그날이 오면</span>
        </button>
        <button
          class="tape tape-3 is-playable"
          data-song="../../../music/아침이슬.m4a"
          type="button"
          aria-label="아침이슬 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">아침이슬</span>
        </button>
        <button
          class="tape tape-4 is-playable"
          data-song="../../../music/솔아 솔아 푸르른 솔아.mp3"
          type="button"
          aria-label="솔아 솔아 푸르른 솔아 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">솔아 솔아 푸르른 솔아</span>
        </button>

        <button
          class="tape tape-5 is-playable"
          data-song="../../../music/national-anthem.mp3"
          type="button"
          aria-label="그날이 오면 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">그날이 오면</span>
        </button>
        <!-- 솔아 솔아 푸르른 솔아 아래 테이프 (tape-5 ~ tape-8)
        
        <button
          class="tape tape-6 is-playable"
          data-song="../../../music/national-anthem.mp3"
          type="button"
          aria-label="아침이슬 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">아침이슬</span>
        </button>
        <button
          class="tape tape-7 is-playable"
          data-song="../../../music/national-anthem.mp3"
          type="button"
          aria-label="광주출전가 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">광주출전가</span>
        </button>
        <button
          class="tape tape-8 is-playable"
          data-song="../../../music/national-anthem.mp3"
          type="button"
          aria-label="솔아 솔아 푸르른 솔아 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">솔아 솔아 푸르른 솔아</span>
        </button>
        -->

        <img
          class="tapes-radio"
          src="../../../asset/history/playlist/라디오.png"
          alt="" />
      </aside>

      <div class="newspaper">
        <article class="newspaper-page">
          <div class="newspaper-scroll">
            <img
              class="newspaper-scan"
              src="../../../asset/history/newspaper/1987.webp"
              alt="1987년 6월 10일 호외 신문 지면" />
          </div>
        </article>
      </div>
    </main>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track">
        <span class="ticker-item">박종철을 살려내라!</span>
        <span class="ticker-item">최루탄을 부수자!</span>
        <span class="ticker-item">고문 살인 은폐 조작 규탄!</span>
        <span class="ticker-item">직선제 쟁취!</span>
        <span class="ticker-item">대통령 직선제!</span>
        <span class="ticker-item">박종철을 살려내라!</span>
        <span class="ticker-item">최루탄을 부수자!</span>
        <span class="ticker-item">고문 살인 은폐 조작 규탄!</span>
        <span class="ticker-item">직선제 쟁취!</span>
        <span class="ticker-item">대통령 직선제!</span>
        <span class="ticker-item">박종철을 살려내라!</span>
        <span class="ticker-item">최루탄을 부수자!</span>
        <span class="ticker-item">고문 살인 은폐 조작 규탄!</span>
        <span class="ticker-item">직선제 쟁취!</span>
        <span class="ticker-item">대통령 직선제!</span>
      </div>
    </div>

    <script src="./script/script.js"></script>
    <script src="../script/ticker.js"></script>
    <script src="../../../style/js/kiosk.js"></script>
  </body>
</html>
