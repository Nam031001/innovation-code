<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>2016 · 호외요 호외 · 다시쓰는 빛의 연대</title>
  </head>
  <body>
    <header class="topbar">
      <button class="topbar-back" type="button" aria-label="뒤로가기">
        <img
          src="../../../asset/leftArrow.png"
          alt="arrow"
          style="filter: brightness(0) invert(1)" />
      </button>
      <div class="topbar-logo">
        <a href="../../../index.html">
          <img src="../../../asset/logoDark.png" alt="logo" />
        </a>
      </div>
    </header>

    <main class="year">
      <audio
        id="audio"
        preload="metadata"
        loop
        src="../../../music/national-anthem.mp3"></audio>

      <aside class="candle">
        <p class="play-hint">곡 제목을 클릭하면<br />음악이 재생/정지됩니다</p>
        <img
          class="candle-img"
          src="../../../asset/history/playlist/양초2.png"
          alt="" />

        <!-- 노래 자리: 각 요소의 data-song에 music 폴더의 곡 파일 경로를 넣으세요. 화면에 보이는 곡 이름은 각 li 안의 글자를 바꾸면 됩니다. -->
        <ul class="player-list">
          <li class="player-track is-active" tabindex="0" role="button" data-song="../../../music/이게나라냐ㅅㅂ_ 윤민석.mp3">
            1. 이게나라냐
          </li>
          <li class="player-track" tabindex="0" role="button" data-song="../../../music/진실은 침몰하지 않는다.mp3">
            2. 진실은 침몰하지 않는다
          </li>
          <li class="player-track" tabindex="0" role="button" data-song="../../../music/격문 1.mp3">
            3. 격문1
          </li>
          <li class="player-track" tabindex="0" role="button" data-song="../../../music/민주승리가(윤민석 작사.작곡).mp3">4. 민주승리가</li>
          <!-- <li class="player-track" tabindex="0" role="button" data-song="../../../music/national-anthem.mp3">5. 진격의 촛불가</li>
          <li class="player-track" tabindex="0" role="button" data-song="../../../music/national-anthem.mp3">6. 국민이 갑이다</li>
          <li class="player-track" tabindex="0" role="button" data-song="../../../music/national-anthem.mp3">7. 민주승리가</li>
          <li class="player-track" tabindex="0" role="button" data-song="../../../music/national-anthem.mp3">8. 다시 한 번</li>
          <li class="player-track" tabindex="0" role="button" data-song="../../../music/national-anthem.mp3">9. 경고</li>
          <li class="player-track" tabindex="0" role="button" data-song="../../../music/national-anthem.mp3">
            10. 우리는 승리하리라
          </li> -->
        </ul>
      </aside>

      <div class="newspaper">
        <article class="newspaper-page">
          <div class="newspaper-scroll">
            <img
              class="newspaper-scan"
              src="../../../asset/history/newspaper/2016.webp"
              alt="2016년 10월 29일 호외 신문 지면" />
          </div>
        </article>
      </div>
    </main>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track">
        <span class="ticker-item">어둠은 빛을 이길 수 없다</span>
        <span class="ticker-item">거짓은 참을 이길 수 없다</span>
        <span class="ticker-item">진실은 침몰하지 않는다</span>
        <span class="ticker-item">우리는 포기하지 않는다</span>
        <span class="ticker-item">어둠은 빛을 이길 수 없다</span>
        <span class="ticker-item">거짓은 참을 이길 수 없다</span>
        <span class="ticker-item">진실은 침몰하지 않는다</span>
        <span class="ticker-item">우리는 포기하지 않는다</span>
        <span class="ticker-item">어둠은 빛을 이길 수 없다</span>
        <span class="ticker-item">거짓은 참을 이길 수 없다</span>
        <span class="ticker-item">진실은 침몰하지 않는다</span>
        <span class="ticker-item">우리는 포기하지 않는다</span>
      </div>
    </div>

    <script src="./script/script.js"></script>
    <script src="../script/ticker.js"></script>
    <script src="../../../style/js/kiosk.js"></script>
  </body>
</html>
