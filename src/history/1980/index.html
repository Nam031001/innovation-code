<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <title>1980 · 호외요 호외 · 다시쓰는 빛의 연대</title>
  </head>
  <body>
    <header class="topbar">
      <button class="topbar-back" type="button" aria-label="뒤로가기">
        <img
          src="../../../asset/leftArrow.png"
          alt="arrow"
          style="filter: brightness(0) invert(1)" />
      </button>
      <div class="topbar-logo">
        <a href="../../../index.html">
          <img src="../../../asset/logoDark.png" alt="logo" />
        </a>
      </div>
    </header>

    <main class="year">
      <audio
        id="audio"
        preload="metadata"
        loop
        src="../../../music/national-anthem.mp3"></audio>

      <aside class="tapes">

        <button
          class="tape tape-1 is-playable"
          type="button"
          aria-label="임을 위한 행진곡 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">임을 위한 행진곡</span>
        </button>
        <button style="margin-bottom: -20px"
          class="tape tape-2 is-playable"
          type="button"
          aria-label="오월의 노래 재생"
          aria-pressed="false">
          <img src="../../../asset/history/playlist/카세트테이프.png" alt="" />
          <span class="tape-song">오월의 노래</span>
        </button>
        <img
          class="tape tape-3"
          src="../../../asset/history/playlist/카세트테이프.png"
          alt="" />
        <img
          class="tape tape-4"
          src="../../../asset/history/playlist/카세트테이프.png"
          alt="" />
        <img
          class="tape tape-5"
          src="../../../asset/history/playlist/카세트테이프.png"
          alt="" />
        <img
          class="tape tape-6"
          src="../../../asset/history/playlist/카세트테이프.png"
          alt="" />

        <img
          class="tapes-radio"
          src="../../../asset/history/playlist/518라디오.png"
          alt="" />
      </aside>

      <div class="newspaper">
        <article class="newspaper-page">
          <div class="newspaper-scroll">
            <img
              class="newspaper-scan"
              src="../../../asset/history/newspaper/1980.png"
              alt="1980년 5월 18일 호외 신문 지면" />
          </div>
        </article>
      </div>
    </main>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track">
        <span class="ticker-item">비상계엄 해제하라!</span>
        <span class="ticker-item">계엄군은 물러가라!</span>
        <span class="ticker-item">김대중 석방하라!</span>
        <span class="ticker-item">전두환 물러가라!</span>
        <span class="ticker-item">비상계엄 해제하라!</span>
        <span class="ticker-item">계엄군은 물러가라!</span>
        <span class="ticker-item">김대중 석방하라!</span>
        <span class="ticker-item">전두환 물러가라!</span>
        <span class="ticker-item">비상계엄 해제하라!</span>
        <span class="ticker-item">계엄군은 물러가라!</span>
        <span class="ticker-item">김대중 석방하라!</span>
        <span class="ticker-item">전두환 물러가라!</span>
      </div>
    </div>

    <script src="./script/script.js"></script>
  </body>
</html>
